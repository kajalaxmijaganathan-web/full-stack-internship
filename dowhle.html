<!DOCTYPE html>
<html>
<head>
    <title>do while Loop Example</title>
</head>
<body>

    <h1>JavaScript do while Loop</h1>
    <p id="demo"></p>
<script>
    let i = 1;
    let text = "";

    do {
        text += "Number: " + i + "<br>";
        i++;
    } while(i <= 5);

    document.getElementById("demo").innerHTML = text;
</script>
</body>
</html>
