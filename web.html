<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy E-Commerce</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:#222;
    color:white;
    position:sticky;
    top:0;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
}

#searchBox{
    padding:8px;
    width:250px;
}

.hero{
    text-align:center;
    padding:60px 20px;
    background:#ddd;
}

.hero button{
    margin-top:15px;
    padding:10px 20px;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    width:280px;
    border-radius:10px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card button{
    margin:5px;
    padding:8px 15px;
    cursor:pointer;
}

.cart-section{
    text-align:center;
    padding:20px;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

footer input{
    padding:8px;
    margin-top:10px;
}

footer button{
    padding:8px 12px;
}

#topBtn{
    margin-top:15px;
}
</style>
</head>
<body>

<header>
    <div class="logo">ShopEasy</div>

    <input type="text" id="searchBox" placeholder="Search Products">

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
    </nav>

    <div id="cartCount">Cart: 0</div>
</header>

<section class="hero">
    <h1>Big Sale 50% Off</h1>
    <p>Explore Amazing Products</p>
    <button id="shopNow">Shop Now</button>
</section>

<section class="products" id="products"></section>

<section class="cart-section">
    <h2>Shopping Cart</h2>
    <h3 id="total">Total Amount: ₹0</h3>
</section>

<footer>
    <h2>ShopEasy</h2>
    <p>Subscribe to our Newsletter</p>

    <input type="email" id="email" placeholder="Enter Email">
    <button onclick="subscribe()">Subscribe</button>

    <br>
    <button id="topBtn">Back To Top</button>

    <p style="margin-top:10px;">© 2026 ShopEasy</p>
</footer>

<script>
const products = [
{
id:1,
name:"Laptop",
price:50000,
image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500",
quantity:0
},
{
id:2,
name:"Mobile",
price:25000,
image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
quantity:0
},
{
id:3,
name:"Headphones",
price:5000,
image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500",
quantity:0
}
];

let total = 0;

function displayProducts(list){
let container=document.getElementById("products");
container.innerHTML="";

list.forEach(product=>{

container.innerHTML += `
<div class="card">
<img src="${product.image}" alt="${product.name}">
<h3>${product.name}</h3>
<p>₹${product.price}</p>

<button onclick="decrease(${product.id})">-</button>

<span id="qty-${product.id}">${product.quantity}</span>

<button onclick="increase(${product.id})">+</button>
</div>
`;
});
}

function increase(id){
let product=products.find(p=>p.id===id);
product.quantity++;
updateCart();
displayProducts(filteredProducts());
}

function decrease(id){
let product=products.find(p=>p.id===id);

if(product.quantity>0){
product.quantity--;
updateCart();
displayProducts(filteredProducts());
}
}

function updateCart(){

let count=0;
total=0;

products.forEach(product=>{
count += product.quantity;
total += product.quantity * product.price;
});

document.getElementById("cartCount").innerHTML="Cart: "+count;

document.getElementById("total").innerHTML=
"Total Amount: ₹"+total;
}

function filteredProducts(){
let search=document.getElementById("searchBox").value.toLowerCase();

return products.filter(product=>
product.name.toLowerCase().includes(search)
);
}

document.getElementById("searchBox")
.addEventListener("keyup",function(){
displayProducts(filteredProducts());
});

document.getElementById("shopNow")
.addEventListener("click",function(){
window.scrollTo({
top:300,
behavior:"smooth"
});
});

function subscribe(){
let email=document.getElementById("email").value;

if(email===""){
alert("Please enter email");
}
else{
alert("Subscribed: "+email);
}
}

document.getElementById("topBtn")
.addEventListener("click",function(){
window.scrollTo({
top:0,
behavior:"smooth"
});
});

displayProducts(products);
</script>

</body>
</html>
