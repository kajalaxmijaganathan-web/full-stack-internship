<!DOCTYPE html>
<html>
<head>
    <title>Webpage with Contact Footer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            background-color: black;
            color: white;
            padding: 10px;
            text-align: center;
        }

        .content { 
            padding: 20px;
            min-height: 250px;
        }

        /* FOOTER STYLE */
        footer {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .contact {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
        }

        .contact a {
            color: yellow;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        My Website
    </div>

    <!-- CONTENT -->
    <div class="content">
        <h2>Welcome to My Webpage</h2>
        <p>This page contains a footer with contact details.</p>
    </div>

    <!-- FOOTER -->
    <footer>
        <h3>Contact Us</h3>

        <div class="contact">
            📞 Mobile: +91 98765 43210 <br>
            📧 Email: support@mywebsite.com <br>
            📍 Location: Mumbai, India <br><br>

            <a href="mailto:support@mywebsite.com">Send Email</a>
        </div>

        <p>&copy; 2026 MyWebsite. All rights reserved.</p>
    </footer>

</body>
</html>
