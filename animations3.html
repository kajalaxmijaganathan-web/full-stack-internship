<!DOCTYPE html>
<html>
<head>
<style>
    button {
        background-color: blue;
        color: white;
        padding: 10px 20px;
        border: none;

        transition: 0.5s;
    }

    button:hover {
        background-color: green;
        transform: scale(1.2);
    }
</style>
</head>

<body>

<button>Hover Me</button>

</body>
</html>
