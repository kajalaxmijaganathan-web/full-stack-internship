<head>

    position: relative;
    height: 200px;
    border: 2px solid black;
}

.box {

    top: 20px;
    right: 20px;

    background-color: orange;
    padding: 20px;
}
</style>
</head>
<body>

<div class="container">
    <div class="box">
        Absolute Position
    </div>
</div>

</body>
</html>
