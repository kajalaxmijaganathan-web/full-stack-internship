<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Array Example</title>
</head>
<body>
    <h1>JavaScript Array Example</h1>
    <p id="demo"></p>
    <script>
        let subjects = ["HTML", "CSS", "JavaScript", "Python"];
        document.getElementById("demo").innerHTML =
            "First Subject: " + subjects[0] + "<br>" +
            "Second Subject: " + subjects[1] + "<br>" +
            "Third Subject: " + subjects[2] + "<br>" +
            "Fourth Subject: " + subjects[3];
        </script>
</body>
</html>
