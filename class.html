<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Class Example</title>
</head>
<body>

    <h1>JavaScript Class Example</h1>

    <p id="demo"></p>

    <script>
       
        class Student {
            constructor(name, age, course) {
                this.name = name;
                this.age = age;
                this.course = course;
            }

            display() {
                return "Name: " + this.name +
                       "<br>Age: " + this.age +
                       "<br>Course: " + this.course;
            }
        }

       
        let student1 = new Student("Kaja", 20, "B.Tech");

       
        document.getElementById("demo").innerHTML =
            student1.display();
    </script>

</body>
</html>
