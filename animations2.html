<!DOCTYPE html>
<html>
<head>
<style>
    .circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;

        animation: changeColor 4s infinite;
    }

    @keyframes changeColor {
        0%   { background-color: red; }
        25%  { background-color: yellow; }
        50%  { background-color: green; }
        75%  { background-color: blue; }
        100% { background-color: red; }
    }
</style>
</head>

<body>

<div class="circle"></div>

</body>
</html>
