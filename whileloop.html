 <!DOCTYPE html>
<html>
<head>
    <title>while Loop Example</title>
</head>
<body>

    <h1>JavaScript while Loop</h1>
    <p id="demo"></p><script>
    let i = 1;
    let text = "";

    while(i <= 5) {
        text += "Number: " + i + "<br>";
        i++;
    }

    document.getElementById("demo").innerHTML = text;
</script>
</body>
</html>
