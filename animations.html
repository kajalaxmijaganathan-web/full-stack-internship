<!DOCTYPE html>
<html>
<head>
    <title>Moving Box Animation</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color:violet;

            animation: moveBox 3s infinite;
        }

        @keyframes moveBox {
            from {
                transform: translateX(0px);
            }

            to {
                transform: translateX(300px);
            }
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>
</html>
