<!DOCTYPE html>
<html>
<head>
    <title>Buttons and Cards</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        /* CARD DESIGN */
        .card {
            width: 250px;
            background-color: white;
            padding: 20px;
            margin: 20px;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        /* BUTTON STYLE */
        .btn {
            background-color: blue;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        /* BUTTON HOVER EFFECT */
        .btn:hover {
            background-color:violet;
        }
    </style>
</head>

<body>

    <h1>My Cards and Buttons</h1>

    <!-- CARD 1 -->
    <div class="card">
        <h2>Card 1</h2>
        <p>This is a simple card design.</p>
        <button class="btn">Click Me</button>
    </div>

    <!-- CARD 2 -->
    <div class="card">
        <h2>Card 2</h2>
        <p>This is another card example.</p>
        <button class="btn">Learn More</button>
    </div>

</body>
</html>
