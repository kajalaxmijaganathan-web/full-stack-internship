<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Variables Demo</title>
</head>
<body>

    <center>
        <h1>JavaScript Variables Example</h1>
    </center>

    <p id="demo"></p>
     <center>
    <script>
        // Declaring variables
        let name = "Kaja";
        let age = 20;
        let course = "B.Tech";

        // Displaying variables
        document.getElementById("demo").innerHTML =
            "Name: " + name + "<br>" +
            "Age: " + age + "<br>" +
            "Course: " + course;
    </script>
</center>
</body>
</html>
