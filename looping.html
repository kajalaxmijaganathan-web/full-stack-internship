 <!DOCTYPE html>
<html>
<head>
    <title>For Loop Example</title>
</head>
<body>

    <h1>JavaScript For Loop</h1>
    <p id="demo"></p>

    <script>
        let text = "";

        for(let i = 1; i <= 5; i++) {
            text += "Number: " + i + "<br>";
        }

        document.getElementById("demo").innerHTML = text;
    </script>

</body>
</html>
</body>
</html>
