<!DOCTYPE html>
<html>
<head>
    <title>Navbar with Flexbox</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* NAVBAR CONTAINER */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 10px 20px;
        }

        /* LOGO */
        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        /* NAV LINKS */
        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: yellow;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <!-- Logo -->
        <div class="logo">MyWebsite</div>

        <!-- Links -->
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

    </div>

</body>
</html>
